name: Smoke test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Install make
        if: runner.os == 'Windows'
        run: choco install make --no-progress

      # The language server and analyzer jars are not committed. Download them like the release build does and put
      # them where LSP-SonarLint.sublime-settings expects them, in the package root.
      - name: Download SonarLint jars
        shell: bash
        run: |
          make jars
          cp out/*.jar .

      - uses: sublimelsp/lsp_smoke_test@v1
