name: Smoke test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # The language server and analyzer jars are not committed; release builds download them with make.
      - name: Download SonarLint jars
        shell: bash
        run: |
          for jar in $(grep -o 'sonar[a-z-]*-[0-9.]*\.jar' LSP-SonarLint.sublime-settings | sort -u); do
            curl -sSfL -o "$jar" "https://binaries.sonarsource.com/Distribution/${jar%-*}/$jar"
          done

      - uses: sublimelsp/lsp_smoke_test@v1
